# Tests Pixel Forge on Linux and builds the one-file app for Linux / the Steam Deck.
#
# - every push to main or linux: run the test suites on a virtual screen, build the
#   app, and check that the built app really opens, edits and saves a texture;
# - a tag like v1.2.0: also publish the app on the repository's Releases page.
name: Linux build

on:
  push:
    branches: [main, linux]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to publish a release from a tag

jobs:
  linux:
    runs-on: ubuntu-22.04   # an older system on purpose: what's built here runs on newer ones (SteamOS)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages (Tk, a virtual screen, the app's font)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tk8.6 libtk8.6 fonts-dejavu-core

      - name: Python packages
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests, on a virtual screen
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python tests/run_all.py

      - name: Keep the tests' screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: /tmp/pixel-forge-tests/**/*.png
          if-no-files-found: ignore

      - name: Build the app (one file, Python and its font included)
        run: |
          mkdir -p build-fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf /usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf build-fonts/
          # (PIL._tkinter_finder is loaded only when the first picture is shown in Tk:
          #  PyInstaller can't see that import, so it's named here)
          pyinstaller --noconfirm --onefile --windowed --name PixelForge \
            --hidden-import PIL._tkinter_finder \
            --add-data "Forge.png:." --add-data "forge.ico:." --add-data "build-fonts:fonts" \
            pixel_forge.py
          ls -lh dist/PixelForge

      - name: Check the built app (describe, then open a texture, paint it and save)
        run: |
          python - <<'EOF'
          from PIL import Image
          Image.new("RGBA", (16, 16), (40, 160, 90, 255)).save("check.png")
          EOF
          xvfb-run -a dist/PixelForge --describe --result describe.json
          cat describe.json
          set +e   # show what the app says before failing
          PIXEL_FORGE_HIDDEN=1 PIXEL_FORGE_TEST_ACTION=paint-save XDG_CONFIG_HOME="$PWD/check-config" \
            xvfb-run -a -s "-screen 0 1280x800x24" dist/PixelForge --edit check.png --name "Check" --result result.json
          echo "exit code: $?"
          cat result.json
          set -e
          python - <<'EOF'
          import json
          from PIL import Image
          assert json.load(open("describe.json"))["protocol"] == 1
          assert json.load(open("result.json"))["status"] == "saved"
          img = Image.open("check.png").convert("RGBA")
          assert img.getpixel((0, 0)) == (255, 0, 255, 255) and img.getpixel((5, 5)) == (40, 160, 90, 255)
          print("the built app opened the texture, painted it and saved it")
          EOF

      - name: Check the built app needs nothing installed (a bare Arch Linux, which SteamOS is built on)
        run: |
          python - <<'EOF'
          from PIL import Image
          Image.new("RGBA", (16, 16), (40, 160, 90, 255)).save("arch-check.png")
          EOF
          # Only a virtual screen is added to the bare system: no Python, no Tk, no fonts.
          docker run --rm -v "$PWD:/w" -w /w archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed xorg-server-xvfb xorg-xauth > /dev/null 2>&1 || { echo "could not prepare the container"; exit 1; }
            echo "python: $(command -v python || echo none)   fonts: $(ls /usr/share/fonts 2>/dev/null | wc -l)"
            PIXEL_FORGE_HIDDEN=1 PIXEL_FORGE_TEST_ACTION=paint-save XDG_CONFIG_HOME=/tmp/cfg \
              xvfb-run -a -s "-screen 0 1280x800x24" dist/PixelForge --edit arch-check.png --name Check --result arch-result.json
            echo "exit code: $?"
            cat arch-result.json'
          python - <<'EOF'
          import json
          from PIL import Image
          assert json.load(open("arch-result.json"))["status"] == "saved"
          assert Image.open("arch-check.png").convert("RGBA").getpixel((0, 0)) == (255, 0, 255, 255)
          print("on a bare Arch Linux the app opened the texture, painted it and saved it")
          EOF

      - name: Check the installer (install, start, uninstall; then from the published release)
        env:
          PF_TOKEN: ${{ github.token }}
        run: |
          export HOME="$PWD/install-home"
          mkdir -p "$HOME/Desktop"
          app="$HOME/.local/share/PixelForge/PixelForge"
          PF_FILE=dist/PixelForge bash install.sh
          test -x "$app"
          test -L "$HOME/.local/bin/pixel-forge"
          test -x "$HOME/Desktop/Pixel Forge.desktop"
          grep -q "^Exec=\"$app\" %f$" "$HOME/.local/share/applications/pixel-forge.desktop"
          xvfb-run -a "$HOME/.local/bin/pixel-forge" --describe > /dev/null
          bash "$HOME/.local/share/PixelForge/install.sh" --uninstall
          test ! -e "$app"
          test ! -e "$HOME/.local/share/applications/pixel-forge.desktop"
          test ! -e "$HOME/Desktop/Pixel Forge.desktop"
          echo "installed from a file, started, and uninstalled cleanly"
          # The download path, against the newest published release (if there is one yet)
          if curl -fsS -o /dev/null -H "Authorization: Bearer $PF_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest"; then
            PF_REPO="$GITHUB_REPOSITORY" bash install.sh
            test -x "$app"
            test -f "$HOME/.local/share/PixelForge/pixel-forge.png"
            xvfb-run -a "$app" --describe > /dev/null
            echo "installed release $(cat "$HOME/.local/share/PixelForge/version") by download"
            # without a token, a private repository says what to do instead of failing obscurely
            if out="$(PF_TOKEN= GITHUB_TOKEN= PF_REPO="$GITHUB_REPOSITORY" bash install.sh 2>&1)"; then echo "(the repository is public: no token needed)"; else echo "$out" | grep -q "PF_TOKEN"; fi
          fi

      - name: A screenshot of the built app at the Steam Deck's size
        run: |
          XDG_CONFIG_HOME="$PWD/shot-config" xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            dist/PixelForge Test/5d5f9f76-74e2-4bc5-82f5-c03a478fecbe.jpg &
            sleep 12
            python -c "from PIL import ImageGrab; ImageGrab.grab(xdisplay=\"$DISPLAY\").save(\"built-app-1280x800.png\")"
            kill %1 || true
          '

      - name: Keep the built app and its screenshot
        uses: actions/upload-artifact@v4
        with:
          name: PixelForge-linux-x86_64
          path: |
            dist/PixelForge
            built-app-1280x800.png

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/PixelForge PixelForge-linux-x86_64
          gh release create "$GITHUB_REF_NAME" PixelForge-linux-x86_64 \
            --title "Pixel Forge $GITHUB_REF_NAME" \
            --notes "Pixel Forge for Linux and the Steam Deck: one file, nothing to install. Download PixelForge-linux-x86_64, mark it as executable (in Dolphin: right-click, Properties, Permissions, 'Is executable') and run it. AI background removal is not included in this build; everything else is. See the README for adding it to Steam."
