# Tests Pixel Forge on Linux and builds the one-file app for Linux / the Steam Deck.
#
# - every push to main or linux: run the test suites on a virtual screen, build the
#   app, and check that the built app really opens, edits and saves a texture;
# - a tag like v1.2.0: also publish the app on the repository's Releases page.
name: Linux build

on:
  push:
    branches: [main, linux]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to publish a release from a tag

jobs:
  linux:
    runs-on: ubuntu-22.04   # an older system on purpose: what's built here runs on newer ones (SteamOS)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages (Tk, a virtual screen, the app's font)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tk8.6 libtk8.6 fonts-dejavu-core

      - name: Python packages
        run: python -m pip install -r requirements-ai-lite.txt pyinstaller   # (Pillow + the small AI engine)

      - name: A release's tag is the app's own version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # (the app compares its version with the newest release's tag to know whether to update)
          version="$(python -c 'import updater; print(updater.VERSION)')"
          echo "the app says $version, the tag is $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Tests, on a virtual screen
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python tests/run_all.py

      - name: Keep the tests' screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: /tmp/pixel-forge-tests/**/*.png
          if-no-files-found: ignore

      - name: Build the app (one file, Python and its font included)
        run: |
          mkdir -p build-fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf /usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf build-fonts/
          # (PIL._tkinter_finder is loaded only when the first picture is shown in Tk:
          #  PyInstaller can't see that import, so it's named here)
          # onnxruntime, numpy and certifi are imported only when AI removal is used (ai_model.py).
          pyinstaller --noconfirm --onefile --windowed --name PixelForge \
            --hidden-import PIL._tkinter_finder \
            --hidden-import onnxruntime --hidden-import numpy --hidden-import certifi \
            --add-data "Forge.png:." --add-data "forge.ico:." --add-data "build-fonts:fonts" \
            pixel_forge.py
          ls -lh dist/PixelForge

      - name: Check the built app (describe, then open a texture, paint it and save)
        run: |
          python - <<'EOF'
          from PIL import Image
          Image.new("RGBA", (16, 16), (40, 160, 90, 255)).save("check.png")
          EOF
          xvfb-run -a dist/PixelForge --describe --result describe.json
          cat describe.json
          set +e   # show what the app says before failing
          PIXEL_FORGE_HIDDEN=1 PIXEL_FORGE_TEST_ACTION=paint-save XDG_CONFIG_HOME="$PWD/check-config" \
            xvfb-run -a -s "-screen 0 1280x800x24" dist/PixelForge --edit check.png --name "Check" --result result.json
          echo "exit code: $?"
          cat result.json
          set -e
          python - <<'EOF'
          import json
          from PIL import Image
          assert json.load(open("describe.json"))["protocol"] == 1
          assert json.load(open("result.json"))["status"] == "saved"
          img = Image.open("check.png").convert("RGBA")
          assert img.getpixel((0, 0)) == (255, 0, 255, 255) and img.getpixel((5, 5)) == (40, 160, 90, 255)
          print("the built app opened the texture, painted it and saved it")
          EOF

      - name: Check the built app needs nothing installed (a bare Arch Linux, which SteamOS is built on)
        run: |
          python - <<'EOF'
          from PIL import Image
          Image.new("RGBA", (16, 16), (40, 160, 90, 255)).save("arch-check.png")
          EOF
          # Only a virtual screen is added to the bare system: no Python, no Tk, no fonts.
          docker run --rm -v "$PWD:/w" -w /w archlinux:latest bash -c '
            # (the package mirrors fail now and then: try three times, and show why if they all do)
            for attempt in 1 2 3; do
              pacman -Syu --noconfirm --needed xorg-server-xvfb xorg-xauth > /tmp/pacman.log 2>&1 && break
              echo "preparing the container failed (attempt $attempt):"; tail -n 6 /tmp/pacman.log
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 15
            done
            echo "python: $(command -v python || echo none)   fonts: $(ls /usr/share/fonts 2>/dev/null | wc -l)"
            PIXEL_FORGE_HIDDEN=1 PIXEL_FORGE_TEST_ACTION=paint-save XDG_CONFIG_HOME=/tmp/cfg \
              xvfb-run -a -s "-screen 0 1280x800x24" dist/PixelForge --edit arch-check.png --name Check --result arch-result.json
            echo "exit code: $?"
            cat arch-result.json'
          python - <<'EOF'
          import json
          from PIL import Image
          assert json.load(open("arch-result.json"))["status"] == "saved"
          assert Image.open("arch-check.png").convert("RGBA").getpixel((0, 0)) == (255, 0, 255, 255)
          print("on a bare Arch Linux the app opened the texture, painted it and saved it")
          EOF

      - name: Remember the AI model between builds (179 MB)
        uses: actions/cache@v4
        with:
          path: ai-data/PixelForge/models
          key: isnet-general-use-60920e99

      - name: Check AI background removal in the built app, on the bare Arch Linux
        run: |
          python - <<'EOF'
          from PIL import Image
          # A 256x256 texture cut from a test picture: an axe on a plain background
          Image.open("Test/Gemini_Generated_Image_ds1uodds1uodds1u.jpg").convert("RGBA").resize((256, 256)).save("ai-check.png")
          EOF
          mkdir -p ai-data
          docker run --rm -v "$PWD:/w" -w /w -e XDG_DATA_HOME=/w/ai-data archlinux:latest bash -c '
            # (the package mirrors fail now and then: try three times, and show why if they all do)
            for attempt in 1 2 3; do
              pacman -Syu --noconfirm --needed xorg-server-xvfb xorg-xauth > /tmp/pacman.log 2>&1 && break
              echo "preparing the container failed (attempt $attempt):"; tail -n 6 /tmp/pacman.log
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 15
            done
            # 1. the app fetches its own model (over HTTPS, with the certificates it carries), unless a build before this one did
            dist/PixelForge --download-ai-model || exit 1
            ls -l ai-data/PixelForge/models/
            # 2. AI Remove BG on the texture, then save
            start=$(date +%s)
            PIXEL_FORGE_HIDDEN=1 PIXEL_FORGE_TEST_ACTION=remove-bg-ai-save XDG_CONFIG_HOME=/tmp/cfg \
              xvfb-run -a -s "-screen 0 1280x800x24" dist/PixelForge --edit ai-check.png --name Check --result ai-result.json
            echo "exit code: $?  ($(( $(date +%s) - start )) s, with starting the app and loading the model)"
            cat ai-result.json'
          sudo chown -R "$USER" ai-data
          python - <<'EOF'
          import json
          from PIL import Image
          assert json.load(open("ai-result.json"))["status"] == "saved"
          before = Image.open("Test/Gemini_Generated_Image_ds1uodds1uodds1u.jpg").convert("RGBA").resize((256, 256))
          after = Image.open("ai-check.png").convert("RGBA")
          alpha = after.getchannel("A")
          cleared = sum(1 for a in alpha.tobytes() if a == 0)
          kept = sum(1 for a in alpha.tobytes() if a == 255)
          assert after.getpixel((2, 2))[3] == 0, "the corner is background: it should be see-through now"
          assert cleared > 256 * 256 * 0.2 and kept > 256 * 256 * 0.05, (cleared, kept)
          assert cleared + kept == 256 * 256, "hard edges: every pixel is kept whole or cleared"
          print(f"AI removed the background in the built app: {cleared} pixels cleared, {kept} kept")
          after.save("ai-check-result.png")
          EOF

      - name: Check the installer (install, start, uninstall; then from the published release)
        env:
          PF_TOKEN: ${{ github.token }}
        run: |
          export HOME="$PWD/install-home"
          mkdir -p "$HOME/Desktop"
          app="$HOME/.local/share/PixelForge/PixelForge"
          PF_FILE=dist/PixelForge bash install.sh
          test -x "$app"
          test -L "$HOME/.local/bin/pixel-forge"
          test -x "$HOME/Desktop/Pixel Forge.desktop"
          grep -q "^Exec=\"$app\" %f$" "$HOME/.local/share/applications/pixel-forge.desktop"
          xvfb-run -a "$HOME/.local/bin/pixel-forge" --describe > /dev/null
          bash "$HOME/.local/share/PixelForge/install.sh" --uninstall
          test ! -e "$app"
          test ! -e "$HOME/.local/share/applications/pixel-forge.desktop"
          test ! -e "$HOME/Desktop/Pixel Forge.desktop"
          echo "installed from a file, started, and uninstalled cleanly"
          # The download path, against the newest published release (if there is one yet)
          if curl -fsS -o /dev/null -H "Authorization: Bearer $PF_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest"; then
            PF_REPO="$GITHUB_REPOSITORY" bash install.sh
            test -x "$app"
            test -f "$HOME/.local/share/PixelForge/pixel-forge.png"
            xvfb-run -a "$app" --describe > /dev/null
            echo "installed release $(cat "$HOME/.local/share/PixelForge/version") by download"
            # without a token, a private repository says what to do instead of failing obscurely
            if out="$(PF_TOKEN= GITHUB_TOKEN= PF_REPO="$GITHUB_REPOSITORY" bash install.sh 2>&1)"; then echo "(the repository is public: no token needed)"; else echo "$out" | grep -q "PF_TOKEN"; fi
          fi

      - name: Check the built app updates itself and restarts (a pretend newer release, served from this machine)
        run: |
          export HOME="$PWD/update-home"
          mkdir -p "$HOME/Desktop" serve
          app="$HOME/.local/share/PixelForge/PixelForge"
          PF_FILE=dist/PixelForge bash install.sh > /dev/null
          # The "newer release": the same app file, said to be version 99.0.0
          cp dist/PixelForge serve/PixelForge-linux-x86_64
          python - <<'EOF'
          import hashlib, json
          data = open("serve/PixelForge-linux-x86_64", "rb").read()
          json.dump({"tag_name": "v99.0.0", "assets": [{
              "name": "PixelForge-linux-x86_64",
              "browser_download_url": "http://127.0.0.1:8765/PixelForge-linux-x86_64",
              "size": len(data), "digest": "sha256:" + hashlib.sha256(data).hexdigest()}]},
              open("serve/latest.json", "w"))
          EOF
          python -m http.server 8765 --bind 127.0.0.1 --directory serve > /dev/null 2>&1 &
          server=$!
          sleep 1
          export PIXEL_FORGE_UPDATE_API=http://127.0.0.1:8765/latest.json
          "$app" --version
          # 1. --update, with no window: the app's file is replaced by the download
          before="$(stat -c %i "$app")"
          "$app" --update
          test "$(stat -c %i "$app")" != "$before"
          cmp "$app" serve/PixelForge-linux-x86_64
          test "$(cat "$HOME/.local/share/PixelForge/version")" = "v99.0.0"
          "$app" --version
          echo "--update replaced the app with the download, and it still starts"
          # 2. In the window: found at startup, downloaded, installed, restarted - and the restarted app reports in
          before="$(stat -c %i "$app")"
          export PIXEL_FORGE_TEST_ACTION=update-restart PIXEL_FORGE_TEST_RESULT="$PWD/update-result.json"
          XDG_CONFIG_HOME="$PWD/update-config" xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            "$0" &
            for i in $(seq 90); do [ -f "$PIXEL_FORGE_TEST_RESULT" ] && break; sleep 1; done
            sleep 1' "$app"
          kill $server
          cat update-result.json; echo
          test "$(stat -c %i "$app")" != "$before"
          python - <<'EOF'
          import json
          result = json.load(open("update-result.json"))
          assert result["status"] == "restarted" and result["from"] == result["version"], result
          assert json.load(open("update-config/PixelForge/settings.json"))["updated_to"] == "99.0.0"
          print("in the window: the update was installed, and the app it restarted is running")
          EOF

      - name: A screenshot of the built app at the Steam Deck's size
        env:
          PIXEL_FORGE_UPDATE_API: http://127.0.0.1:9/none   # (the app looks for updates when it starts: not from here)
        run: |
          XDG_CONFIG_HOME="$PWD/shot-config" xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            dist/PixelForge Test/5d5f9f76-74e2-4bc5-82f5-c03a478fecbe.jpg &
            sleep 12
            python -c "from PIL import ImageGrab; ImageGrab.grab(xdisplay=\"$DISPLAY\").save(\"built-app-1280x800.png\")"
            kill %1 || true
          '

      - name: Keep the built app and its screenshot
        uses: actions/upload-artifact@v4
        with:
          name: PixelForge-linux-x86_64
          path: |
            dist/PixelForge
            built-app-1280x800.png
            ai-check-result.png

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/PixelForge PixelForge-linux-x86_64
          gh release create "$GITHUB_REF_NAME" PixelForge-linux-x86_64 \
            --title "Pixel Forge $GITHUB_REF_NAME" \
            --notes "Pixel Forge for Linux and the Steam Deck: one file, nothing to install. Download PixelForge-linux-x86_64, mark it as executable (in Dolphin: right-click, Properties, Permissions, 'Is executable') and run it. AI background removal is built in; its model (179 MB) is downloaded once, the first time you use it, and then works offline. The app updates itself: it tells you when a newer version is there. See the README for the one-line install from Konsole and for adding it to Steam."
